<div class="max-w-2xl mx-auto p-4">
  <h1 class="text-2xl font-bold mb-6">Editar Cápsula</h1>

  @if (isLoading()) {
    <p>Cargando datos...</p>
  } @else {
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="space-y-4">

      @if (errorMessage()) {
        <div class="bg-red-100 text-red-700 p-3 rounded">
          {{ errorMessage() }}
        </div>
      }

      <div>
        <label class="block text-sm font-medium">Título</label>
        <input type="text" formControlName="title" class="mt-1 block w-full border rounded p-2">
      </div>

      <div>
        <label class="block text-sm font-medium">Descripción</label>
        <textarea formControlName="description" class="mt-1 block w-full border rounded p-2"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium">Fecha de apertura</label>
          <input type="date" formControlName="date" class="mt-1 block w-full border rounded p-2">
        </div>
        <div>
          <label class="block text-sm font-medium">Hora</label>
          <input type="time" formControlName="time" class="mt-1 block w-full border rounded p-2">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium">Zona Horaria</label>
        <input type="text" formControlName="timezone" readonly class="mt-1 block w-full border rounded p-2 bg-gray-50 text-gray-500">
      </div>

      <div class="flex justify-end gap-2">
        <button type="button" routerLink="/dashboard" class="px-4 py-2 border rounded">Cancelar</button>
        <button type="submit" [disabled]="isSubmitting() || editForm.invalid" class="px-4 py-2 bg-blue-600 text-white rounded disabled:opacity-50">
          {{ isSubmitting() ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </form>
  }
</div>
