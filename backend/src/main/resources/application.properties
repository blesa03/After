spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/after}
spring.datasource.username=${DB_USERNAME:after}
spring.datasource.password=${DB_PASSWORD:after}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

after.auth.jwt.issuer=after-api
after.auth.jwt.access-token-ttl=15m
after.auth.jwt.secret=${AFTER_JWT_SECRET:after-local-development-jwt-secret-change-me-0123456789abcdef}

after.auth.refresh.ttl=30d
after.auth.refresh.cookie-name=after_refresh
after.auth.refresh.path=/api/auth
after.auth.refresh.same-site=Strict
after.auth.refresh.secure=false

storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.access-key=${S3_ACCESS_KEY:after}
storage.secret-key=${S3_SECRET_KEY:after-minio-dev}
storage.bucket=${S3_BUCKET:after-media}
storage.region=${S3_REGION:us-east-1}
storage.presign-ttl=${S3_PRESIGN_TTL:15m}