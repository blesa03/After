spring.application.name=media-worker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/after}
spring.datasource.username=${DB_USERNAME:after}
spring.datasource.password=${DB_PASSWORD:after}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.access-key=${MINIO_ACCESS_KEY:after}
storage.secret-key=${MINIO_SECRET_KEY:after-minio-dev}
storage.bucket=${MINIO_BUCKET:after-media}
storage.region=${S3_REGION:us-east-1}